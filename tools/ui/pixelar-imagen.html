      <div class="zona" id="zona">
        <span class="zona-icono"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5m0 0-4 4m4-4 4 4M5 19h14"/></svg></span>
        <p class="zona-titulo">Arrastra una imagen aquí</p>
        <p class="zona-texto">o pulsa para elegirla · JPG, PNG, WebP, GIF o BMP</p>
      </div>
      <input class="entrada-archivo" id="entrada" type="file" aria-label="Elegir imagen" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp">

      <div id="panel" hidden>
        <div class="opciones">
          <label class="campo">Efecto
            <select id="efecto">
              <option value="pixelar">Pixelar</option>
              <option value="difuminar">Difuminar</option>
              <option value="tapar">Tapar con negro (el más seguro)</option>
            </select>
          </label>
          <label class="campo" id="campoIntensidad">Intensidad: <output id="intensidadValor">5</output>
            <input id="intensidad" type="range" min="1" max="10" step="1" value="5">
          </label>
        </div>
        <div class="vista"><canvas id="lienzo" class="interactivo" aria-label="Imagen: arrastra para marcar las zonas a censurar"></canvas></div>
        <div class="barra">
          <span class="barra-info" id="cuenta">Arrastra sobre la imagen para marcar una zona.</span>
          <span class="barra-acciones">
            <button class="boton boton-secundario boton-pequeno" type="button" id="deshacer" disabled>Deshacer</button>
            <button class="boton boton-secundario boton-pequeno" type="button" id="limpiar" disabled>Quitar todas</button>
          </span>
        </div>
        <div class="barra">
          <button class="boton boton-secundario boton-pequeno" type="button" id="cambiar">Elegir otra imagen</button>
          <button class="boton" type="button" id="guardar" disabled>Descargar imagen censurada</button>
        </div>
      </div>
