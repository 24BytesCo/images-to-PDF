      <style>
        .pal-elegido { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 18px; }
        .pal-elegido .muestra-color { width: 64px; height: 64px; flex: none; }
        .pal-codigos { display: grid; gap: 4px; font-size: 14.5px; }
        .pal-codigos button { text-align: left; padding: 3px 0; border: 0; background: none; cursor: pointer; font-family: ui-monospace, monospace; font-size: 14.5px; }
        .pal-codigos button:hover { color: var(--acento-oscuro); }
      </style>
      <div class="zona" id="zona">
        <span class="zona-icono"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5m0 0-4 4m4-4 4 4M5 19h14"/></svg></span>
        <p class="zona-titulo">Arrastra una imagen aquí</p>
        <p class="zona-texto">o pulsa para elegirla · JPG, PNG, WebP, GIF o BMP</p>
      </div>
      <input class="entrada-archivo" id="entrada" type="file" aria-label="Elegir imagen" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp">

      <div id="panel" hidden>
        <div class="vista"><canvas id="lienzo" class="interactivo" aria-label="Imagen: pulsa sobre un punto para tomar su color"></canvas></div>
        <p class="dato">Pulsa cualquier punto de la imagen para tomar su color exacto.</p>
        <div class="pal-elegido">
          <span class="muestra-color" id="elegidoMuestra" style="background:#ffffff"></span>
          <div class="pal-codigos">
            <button type="button" id="cHex" aria-label="Copiar HEX">—</button>
            <button type="button" id="cRgb" aria-label="Copiar RGB">—</button>
            <button type="button" id="cHsl" aria-label="Copiar HSL">—</button>
          </div>
        </div>
        <div class="opciones">
          <label class="campo">Colores dominantes
            <select id="cuantos">
              <option value="4">4 colores</option>
              <option value="6" selected>6 colores</option>
              <option value="8">8 colores</option>
              <option value="10">10 colores</option>
            </select>
          </label>
        </div>
        <div class="muestras" id="muestras"></div>
        <div class="fila-botones">
          <button class="boton boton-secundario" type="button" id="copiarHex">Copiar todos (HEX)</button>
          <button class="boton boton-secundario" type="button" id="copiarCss">Copiar como variables CSS</button>
          <button class="boton" type="button" id="bajar">Descargar paleta (PNG)</button>
          <button class="boton boton-secundario" type="button" id="cambiar">Elegir otra imagen</button>
        </div>
      </div>
