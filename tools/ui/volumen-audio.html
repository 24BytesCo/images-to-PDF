      <div class="zona" id="zona">
        <span class="zona-icono"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5m0 0-4 4m4-4 4 4M5 19h14"/></svg></span>
        <p class="zona-titulo">Arrastra tu audio aquí</p>
        <p class="zona-texto">o pulsa para elegirlo · MP3, WAV, M4A, OGG, FLAC…</p>
      </div>
      <input class="entrada-archivo" id="entrada" type="file" aria-label="Elegir audio" accept="audio/*,video/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac,.mp4,.m4v,.mov,.webm,.mkv,.avi,.3gp">

      <div id="panel" hidden>
        <div class="barra">
          <span class="barra-info" id="resumen"></span>
          <button class="boton boton-secundario boton-pequeno" type="button" id="vaciar">Vaciar</button>
        </div>
        <div class="opciones">
          <label class="campo">Qué hacer
            <select id="modo"><option value="normalizar" selected>Normalizar (volumen parejo y estándar)</option><option value="ganancia">Subir o bajar un número de dB</option></select>
          </label>
          <label class="campo" id="campoDb" hidden>Cambio en dB (positivo sube, negativo baja)
            <input id="db" type="number" inputmode="decimal" min="-40" step="1" value="6">
          </label>
          <label class="campo">Guardar como
            <select id="formato"><option value="mp3" selected>MP3 · 192 kbps (recomendado)</option><option value="wav">WAV · sin compresión</option></select>
          </label>
        </div>

        <div class="barra">
          <span class="ayuda">La primera vez descarga el motor (~30 MB); después queda guardado. +6 dB es un audio claramente más fuerte.</span>
          <button class="boton" type="button" id="ejecutar">Ajustar volumen</button>
        </div>
      </div>
      <div id="salida"></div>
