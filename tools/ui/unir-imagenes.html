      <style>

        .unir-fila canvas { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; background: #f1f4f8; flex: none; }
        .unir-fila .lista-nombre { flex: 1; }
        .unir-mover { border: 1px solid #b9c2cf; background: var(--papel); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 16px; line-height: 1; }

      <div class="zona" id="zona">

        <p class="zona-titulo">Arrastra las imágenes que quieres unir</p>

      <input class="entrada-archivo" id="entrada" type="file" aria-label="Elegir imágenes" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp" multiple>

      <div id="panel" hidden>
        <div class="lista" id="lista"></div>

        <div class="opciones">
          <label class="campo">Disposición
            <select id="modo">

              <option value="cuadricula">Cuadrícula</option>

              <option value="2">2</option><option value="3">3</option><option value="4">4</option>

          <button class="boton boton-secundario boton-pequeno" type="button" id="vaciar">Empezar de nuevo</button>
