      <style>
        .conv-fila { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
      </style>
      <div class="zona" id="zona">
        <span class="zona-icono"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5m0 0-4 4m4-4 4 4M5 19h14"/></svg></span>
        <p class="zona-titulo">Arrastra tus imágenes aquí</p>
        <p class="zona-texto">o pulsa para elegirlas · JPG, PNG, WebP, GIF o BMP</p>
      </div>
      <input class="entrada-archivo" id="entrada" type="file" aria-label="Elegir imágenes" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp" multiple>

      <div id="panel" hidden>
        <div class="opciones">
          <label class="campo">Convertir a
            <select id="formato">
              <option value="image/png">PNG (sin pérdida, con transparencia)</option>
              <option value="image/jpeg">JPG (fotos, el más compatible)</option>
              <option value="image/webp">WebP (menor peso)</option>
              <option value="image/bmp">BMP (sin compresión)</option>
            </select>
          </label>
          <label class="campo" id="campoCalidad" hidden>Calidad: <output id="calidadValor">90 %</output>
            <input id="calidad" type="range" min="40" max="100" step="5" value="90">
          </label>
          <label class="campo" id="campoFondo" hidden>Fondo para las zonas transparentes
            <input id="fondo" type="color" value="#ffffff">
            <small>JPG y BMP no guardan transparencia.</small>
          </label>
        </div>
        <div class="barra">
          <span class="barra-info" id="resumen"></span>
          <button class="boton boton-secundario boton-pequeno" type="button" id="vaciar">Vaciar</button>
        </div>
        <div class="lista" id="lista"></div>
        <div class="barra">
          <span class="ayuda">Un GIF animado se convierte solo en su primer cuadro.</span>
          <button class="boton" type="button" id="convertir">Convertir y descargar</button>
        </div>
      </div>
