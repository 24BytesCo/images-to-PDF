      <div class="pestanas" role="group" aria-label="Dirección de la conversión">
        <button class="pestana" type="button" id="tab-a" aria-pressed="true">Imagen a Base64</button>
        <button class="pestana" type="button" id="tab-b" aria-pressed="false">Base64 a imagen</button>
      </div>

      <div id="vista-a">
        <div class="zona" id="zona">
          <span class="zona-icono"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5m0 0-4 4m4-4 4 4M5 19h14"/></svg></span>
          <p class="zona-titulo">Arrastra una imagen aquí</p>
          <p class="zona-texto">o pulsa para elegirla · JPG, PNG, WebP, GIF, BMP o SVG</p>
        </div>
        <input class="entrada-archivo" id="entrada" type="file" aria-label="Elegir imagen" accept="image/*">
        <div id="resultado-a" hidden>
          <p class="dato" id="info-a"></p>
          <label class="campo">Formato de salida
            <select id="salida">
              <option value="uri">Data URI (data:image/png;base64,…)</option>
              <option value="puro">Solo el Base64</option>
              <option value="html">Etiqueta HTML &lt;img&gt;</option>
              <option value="css">CSS background-image</option>
            </select>
          </label>
          <textarea class="codigo" id="texto-a" readonly aria-label="Resultado en Base64"></textarea>
          <div class="fila-botones">
            <button class="boton" type="button" id="copiar">Copiar</button>
            <button class="boton boton-secundario" type="button" id="bajar-txt">Descargar como .txt</button>
            <button class="boton boton-secundario" type="button" id="otra">Elegir otra imagen</button>
          </div>
        </div>
      </div>

      <div id="vista-b" hidden>
        <label class="campo">Pega aquí el Base64 o el data URI
          <textarea class="codigo" id="texto-b" spellcheck="false" placeholder="data:image/png;base64,iVBORw0KGgo…"></textarea>
        </label>
        <div class="vista" id="caja-b" hidden><img id="previa-b" alt="Vista previa de la imagen decodificada"></div>
        <p class="dato" id="info-b"></p>
        <div class="fila-botones">
          <button class="boton" type="button" id="bajar-img" disabled>Descargar imagen</button>
        </div>
      </div>
