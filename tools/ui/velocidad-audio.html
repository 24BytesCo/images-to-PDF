      <div class="zona" id="zona">
        <span class="zona-icono"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5m0 0-4 4m4-4 4 4M5 19h14"/></svg></span>
        <p class="zona-titulo">Arrastra tu audio aquí</p>
        <p class="zona-texto">o pulsa para elegirlo · MP3, WAV, M4A, OGG, FLAC…</p>
      </div>
      <input class="entrada-archivo" id="entrada" type="file" aria-label="Elegir audio" accept="audio/*,video/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac,.mp4,.m4v,.mov,.webm,.mkv,.avi,.3gp">

      <div id="panel" hidden>
        <div class="barra">
          <span class="barra-info" id="resumen"></span>
          <button class="boton boton-secundario boton-pequeno" type="button" id="vaciar">Vaciar</button>
        </div>
        <div class="opciones">
          <label class="campo">Velocidad (0,25× a 4×)
            <input id="factor" type="number" inputmode="decimal" min="0.25" step="0.05" value="1.25">
            <span class="ayuda">Atajos: <button class="boton boton-secundario boton-pequeno" type="button" data-factor="0.75">0,75×</button> <button class="boton boton-secundario boton-pequeno" type="button" data-factor="1.25">1,25×</button> <button class="boton boton-secundario boton-pequeno" type="button" data-factor="1.5">1,5×</button> <button class="boton boton-secundario boton-pequeno" type="button" data-factor="2">2×</button></span>
          </label>
          <label class="campo">Tono de la voz
            <select id="tono"><option value="mantener" selected>Mantener el tono (la voz suena natural)</option><option value="cambiar">Cambiar el tono con la velocidad (efecto disco)</option></select>
          </label>
        </div>

        <div class="barra">
          <span class="ayuda">La primera vez descarga el motor (~30 MB); después queda guardado.</span>
          <button class="boton" type="button" id="ejecutar">Cambiar velocidad</button>
        </div>
      </div>
      <div id="salida"></div>
