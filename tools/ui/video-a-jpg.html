      <div class="zona" id="zona">
        <span class="zona-icono"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5m0 0-4 4m4-4 4 4M5 19h14"/></svg></span>
        <p class="zona-titulo">Arrastra tu video aquí</p>
        <p class="zona-texto">o pulsa para elegirlo · MP4, MOV, WebM, MKV…</p>
      </div>
      <input class="entrada-archivo" id="entrada" type="file" aria-label="Elegir video" accept="video/*,.mp4,.m4v,.mov,.webm,.mkv,.avi,.3gp,.wmv,.flv">

      <div id="panel" hidden>
        <div class="barra">
          <span class="barra-info" id="resumen"></span>
          <button class="boton boton-secundario boton-pequeno" type="button" id="vaciar">Vaciar</button>
        </div>
        <video class="ff-previa" id="previa" controls preload="metadata" playsinline hidden></video>
        <div class="opciones">
          <label class="campo">Qué sacar
            <select id="modo"><option value="uno" selected>Un fotograma en un instante</option><option value="varios">Varios: uno cada cierto tiempo (ZIP)</option></select>
          </label>
          <label class="campo">Calidad del JPG
            <select id="calidad"><option value="5" selected>Alta (recomendada)</option><option value="9">Media · más liviano</option><option value="15">Baja · mínimo peso</option></select>
          </label>
        </div>
        <div class="opciones" id="campoUno">
          <label class="campo">Instante (segundos)
            <input id="instante" type="number" inputmode="decimal" min="0" step="0.1" value="0">
          </label>
          <button class="boton boton-secundario boton-pequeno" type="button" id="marcarInstante">Usar el instante de la vista previa</button>
        </div>
        <div class="opciones" id="campoVarios" hidden>
          <label class="campo">Desde (segundos)
            <input id="desde" type="number" inputmode="decimal" min="0" step="0.1" value="0">
          </label>
          <label class="campo">Hasta (segundos)
            <input id="hasta" type="number" inputmode="decimal" min="0" step="0.1" value="0">
          </label>
          <label class="campo">Un fotograma cada (segundos)
            <input id="cada" type="number" inputmode="decimal" min="0.1" step="0.1" value="1">
          </label>
        </div>

        <div class="barra">
          <span class="ayuda">La primera vez descarga el motor (~30 MB); después queda guardado. Máximo 150 fotogramas por ZIP.</span>
          <button class="boton" type="button" id="ejecutar">Extraer</button>
        </div>
      </div>
      <div id="salida"></div>
