      <div class="zona" id="zona">
        <span class="zona-icono"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5m0 0-4 4m4-4 4 4M5 19h14"/></svg></span>
        <p class="zona-titulo">Arrastra tu video aquí</p>
        <p class="zona-texto">o pulsa para elegirlo · MP4, MOV, WebM, MKV…</p>
      </div>
      <input class="entrada-archivo" id="entrada" type="file" aria-label="Elegir video" accept="video/*,.mp4,.m4v,.mov,.webm,.mkv,.avi,.3gp">

      <div id="panel" hidden>
        <div class="barra">
          <span class="barra-info" id="resumen"></span>
          <button class="boton boton-secundario boton-pequeno" type="button" id="vaciar">Vaciar</button>
        </div>
        <div class="opciones">
          <label class="campo">Empezar en (segundos)
            <input id="desde" type="number" inputmode="decimal" min="0" step="0.1" value="0">
          </label>
          <label class="campo">Duración del GIF (segundos, máx. 30)
            <input id="duracion" type="number" inputmode="decimal" min="0.5" step="0.1" value="5">
          </label>
          <label class="campo">Ancho
            <select id="ancho"><option value="320">320 px · liviano</option><option value="480" selected>480 px (recomendado)</option><option value="640">640 px · más nitidez</option></select>
          </label>
          <label class="campo">Cuadros por segundo
            <select id="fps"><option value="8">8 · muy liviano</option><option value="10" selected>10 (recomendado)</option><option value="15">15 · más fluido</option></select>
          </label>
        </div>

        <div class="barra">
          <span class="ayuda">La primera vez descarga el motor (~30 MB). Un GIF largo pesa mucho.</span>
          <button class="boton" type="button" id="ejecutar">Crear GIF</button>
        </div>
      </div>
      <div id="salida"></div>
