      <style>
        /* Estilos propios de markdown-a-pdf: paneles editor/vista previa y pestañas en móvil. */
        .mdapdf-zona { min-height: auto; padding: 12px 16px; display: flex; align-items: center; gap: 10px; text-align: left; }
        .mdapdf-zona .zona-icono { width: 34px; height: 34px; flex: none; }
        .mdapdf-zona p { margin: 0; }
        .mdapdf-zona .zona-titulo { font-size: 15px; }
        .mdapdf-zona .zona-texto { font-size: 13.5px; }
        .mdapdf-tabs { display: none; gap: 8px; margin-top: 14px; }
        .mdapdf-tab { flex: 1; padding: 10px; border: 1px solid #b9c2cf; background: var(--papel); border-radius: 10px; font-weight: 600; cursor: pointer; }
        .mdapdf-tab[aria-selected="true"] { background: var(--tinta); color: #fff; border-color: var(--tinta); }
        .mdapdf-paneles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
        .mdapdf-panel { min-width: 0; }
        .mdapdf-panel-titulo { font-size: 13px; font-weight: 700; color: var(--gris); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 8px; }
        .mdapdf-editor { width: 100%; height: 440px; resize: vertical; padding: 14px; border: 1px solid #b9c2cf; border-radius: 10px; font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #f8fafc; }
        .mdapdf-vista { height: 440px; overflow: auto; padding: 16px 20px; border: 1px solid var(--linea); border-radius: 10px; background: var(--papel); }
        .mdapdf-vista > :first-child { margin-top: 0; }
        .mdapdf-vista table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
        .mdapdf-vista th, .mdapdf-vista td { border: 1px solid var(--linea); padding: 6px 10px; text-align: left; }
        .mdapdf-vista blockquote { margin: 12px 0; padding: 2px 14px; border-left: 3px solid var(--acento); color: var(--gris); }
        .mdapdf-vista pre { background: #f1f5f9; padding: 12px 14px; border-radius: 8px; overflow: auto; font-size: 13px; }
        .mdapdf-vista code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
        .mdapdf-vista pre code { background: none; padding: 0; }
        .mdapdf-vista img { max-width: 100%; }
        @media (max-width: 760px) {
          .mdapdf-paneles { grid-template-columns: 1fr; }
          .mdapdf-tabs { display: flex; }
          .mdapdf-panel.mdapdf-oculto-movil { display: none; }
        }
      </style>

      <div class="zona mdapdf-zona" id="mdapdfZona">
        <span class="zona-icono"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5m0 0-4 4m4-4 4 4M5 19h14"/></svg></span>
        <p><span class="zona-titulo">Arrastra un archivo .md aquí</span><br><span class="zona-texto">o pulsa para elegirlo · .md, .markdown o .txt</span></p>
      </div>
      <input class="entrada-archivo" id="mdapdfArchivo" type="file" aria-label="Elegir archivo Markdown" accept=".md,.markdown,.txt,text/markdown,text/plain">

      <div class="mdapdf-tabs" role="tablist" aria-label="Vista de la herramienta">
        <button class="mdapdf-tab" type="button" id="mdapdfTabEscribir" role="tab" aria-selected="true" aria-controls="mdapdfPanelEditor">Escribir</button>
        <button class="mdapdf-tab" type="button" id="mdapdfTabVista" role="tab" aria-selected="false" aria-controls="mdapdfPanelVista">Vista previa</button>
      </div>

      <div class="mdapdf-paneles">
        <div class="mdapdf-panel" id="mdapdfPanelEditor">
          <p class="mdapdf-panel-titulo">Escribir</p>
          <textarea class="mdapdf-editor" id="mdapdfEditor" spellcheck="false" aria-label="Markdown"></textarea>
        </div>
        <div class="mdapdf-panel mdapdf-oculto-movil" id="mdapdfPanelVista">
          <p class="mdapdf-panel-titulo">Vista previa</p>
          <div class="mdapdf-vista" id="mdapdfVista" aria-live="polite"></div>
        </div>
      </div>

      <div class="barra">
        <span class="ayuda">La vista previa se actualiza mientras escribes.</span>
        <button class="boton boton-secundario boton-pequeno" type="button" id="mdapdfLimpiar">Limpiar</button>
      </div>

      <div class="opciones">
        <label class="campo">Tamaño de página
          <select id="mdapdfFormato">
            <option value="a4">A4</option>
            <option value="carta">Carta</option>
          </select>
        </label>
        <label class="campo">Márgenes
          <select id="mdapdfMargen">
            <option value="estrecho">Estrecho</option>
            <option value="normal" selected>Normal</option>
            <option value="amplio">Amplio</option>
          </select>
        </label>
        <label class="campo">Tamaño de letra
          <select id="mdapdfTamano">
            <option value="10">Pequeño</option>
            <option value="12" selected>Normal</option>
            <option value="14">Grande</option>
          </select>
        </label>
        <label class="campo">
          <span style="display:flex; align-items:center; gap:8px; font-weight:600;">
            <input type="checkbox" id="mdapdfPie" checked style="width:auto;">
            Numerar páginas
          </span>
        </label>
        <label class="campo">Nombre del archivo
          <input id="mdapdfNombre" type="text" value="documento" maxlength="80">
        </label>
      </div>

      <div class="barra">
        <span class="ayuda">El PDF se crea en tu dispositivo, con texto real y seleccionable.</span>
        <button class="boton" type="button" id="mdapdfDescargar">Descargar PDF</button>
      </div>
