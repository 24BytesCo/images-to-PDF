      <div class="zona" id="zona">
        <span class="zona-icono"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5m0 0-4 4m4-4 4 4M5 19h14"/></svg></span>
        <p class="zona-titulo">Arrastra tu video aquí</p>
        <p class="zona-texto">o pulsa para elegirlo · MP4, MOV, WebM, MKV…</p>
      </div>
      <input class="entrada-archivo" id="entrada" type="file" aria-label="Elegir video" accept="video/*,.mp4,.m4v,.mov,.webm,.mkv,.avi,.3gp,.wmv,.flv">

      <div id="panel" hidden>
        <div class="barra">
          <span class="barra-info" id="resumen"></span>
          <button class="boton boton-secundario boton-pequeno" type="button" id="vaciar">Vaciar</button>
        </div>
        <div class="opciones">
          <label class="campo">Velocidad
            <select id="factor"><option value="0.25">0,25× · cámara muy lenta</option><option value="0.5" selected>0,5× · cámara lenta</option><option value="0.75">0,75×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="2">2× · el doble de rápido</option><option value="3">3×</option><option value="4">4× · timelapse suave</option></select>
          </label>
          <label class="campo">Audio
            <select id="audio"><option value="conservar" selected>Conservarlo, con la misma velocidad y tono natural</option><option value="quitar">Quitarlo</option></select>
          </label>
        </div>
        <p class="ayuda" id="avisoLenta" hidden>En cámara lenta los fotogramas se repiten: un video grabado a 30 fps no se verá fluido a 0,25×. Funciona mejor con grabaciones a 60 fps o más.</p>

        <div class="barra">
          <span class="ayuda">La primera vez descarga el motor (~30 MB); después queda guardado.</span>
          <button class="boton" type="button" id="ejecutar">Cambiar velocidad</button>
        </div>
      </div>
      <div id="salida"></div>
