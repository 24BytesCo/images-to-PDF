      <div class="zona" id="zona">
        <span class="zona-icono"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5m0 0-4 4m4-4 4 4M5 19h14"/></svg></span>
        <p class="zona-titulo">Arrastra tu video aquí</p>
        <p class="zona-texto">o pulsa para elegirlo · MP4, MOV, WebM, MKV…</p>
      </div>
      <input class="entrada-archivo" id="entrada" type="file" aria-label="Elegir video" accept="video/*,.mp4,.m4v,.mov,.webm,.mkv,.avi,.3gp,.wmv,.flv">

      <div id="panel" hidden>
        <div class="barra">
          <span class="barra-info" id="resumen"></span>
          <button class="boton boton-secundario boton-pequeno" type="button" id="vaciar">Vaciar</button>
        </div>
        <video class="ff-previa" id="previa" controls preload="metadata" playsinline hidden></video>
        <div class="opciones ff-rango">
          <label class="campo">Inicio (segundos)
            <input id="inicio" type="number" inputmode="decimal" min="0" step="0.1" value="0">
          </label>
          <label class="campo">Fin (segundos)
            <input id="fin" type="number" inputmode="decimal" min="0" step="0.1" value="0">
          </label>
        </div>
        <div class="barra"><span class="barra-acciones"><button class="boton boton-secundario boton-pequeno" type="button" id="marcarInicio">Marcar inicio aquí</button><button class="boton boton-secundario boton-pequeno" type="button" id="marcarFin">Marcar fin aquí</button></span><span class="barra-info" id="tramo" aria-live="polite"></span></div>
        <div class="opciones">
          <label class="campo">Tipo de recorte
            <select id="modo"><option value="preciso" selected>Preciso, al fotograma (recodifica, tarda más)</option><option value="rapido">Rápido, sin recodificar (puede traer unos segundos de más)</option></select>
          </label>
        </div>

        <div class="barra">
          <span class="ayuda">La primera vez descarga el motor (~30 MB); después queda guardado.</span>
          <button class="boton" type="button" id="ejecutar">Recortar video</button>
        </div>
      </div>
      <div id="salida"></div>
