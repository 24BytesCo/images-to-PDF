      <div class="zona" id="dividirZona">
        <span class="zona-icono"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18H6z"/><path d="M8 12h8" stroke-dasharray="2.4 2.4"/></svg></span>
        <p class="zona-titulo">Arrastra tu PDF aquí</p>
        <p class="zona-texto">o pulsa para elegirlo · un solo archivo PDF</p>
      </div>
      <input class="entrada-archivo" id="dividirEntrada" type="file" accept="application/pdf">

      <div id="dividirPanel" hidden>
        <div class="barra">
          <span class="barra-info" id="dividirResumen"></span>
          <div class="barra-acciones">
            <button class="boton boton-secundario boton-pequeno" type="button" id="dividirQuitar">Quitar archivo</button>
          </div>
        </div>
        <div class="opciones">
          <label class="campo">Modo
            <select id="dividirModo">
              <option value="rango">Extraer un rango de páginas</option>
              <option value="pagina">Separar cada página en su propio PDF</option>
              <option value="cada">Partir cada N páginas</option>
            </select>
          </label>
          <label class="campo" id="dividirCampoRango">Páginas a extraer
            <input id="dividirRango" type="text" placeholder="Ej: 1-3, 5, 8-10">
            <small>Números y comas; usa un guion para los rangos.</small>
          </label>
          <label class="campo" id="dividirCampoCada" hidden>Páginas por archivo
            <input id="dividirCada" type="number" min="1" step="1" value="4">
          </label>
          <label class="campo">Nombre base
            <input id="dividirNombre" type="text" value="documento" maxlength="80">
          </label>
        </div>
        <div class="barra">
          <span class="ayuda">Si el resultado es más de un PDF, se entrega en un ZIP.</span>
          <button class="boton" type="button" id="dividirBoton">Dividir PDF</button>
        </div>
      </div>
